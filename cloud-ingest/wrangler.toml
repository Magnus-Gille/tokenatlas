# Worker + D1 for the TokenAtlas cloud ingest (docs/architecture/cloud-ingest.md, slice 2).
# Deploy is a manual, operator step; nothing here is applied by CI. Before the first deploy:
#   wrangler d1 create tokenatlas-ingest [--jurisdiction eu]   # jurisdiction is fixed at creation: decide first (design section 9)
#   put the printed database_id below
#   wrangler d1 migrations apply tokenatlas-ingest --remote
# No `routes`/custom domain is configured here on purpose (design section 11 wants one; that is a DNS decision for the owner).
name = "tokenatlas-ingest"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
# Off on purpose: with no route the Worker is unreachable until the owner decides how to expose it. A custom domain route is the
# production answer (design section 11); for a throwaway staging deploy set workers_dev = true and delete the Worker afterwards.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "tokenatlas-ingest"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations/sqlite"
