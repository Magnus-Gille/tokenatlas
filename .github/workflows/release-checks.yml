name: Release checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install build tools
        run: python -m pip install "setuptools>=77" wheel pipx==1.17.12 uv==0.13.0
      - name: Verify packaged Windows timezone data
        if: runner.os == 'Windows'
        run: |
          python -m pip install .
          python -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Stockholm')"
      - name: Unit and release-artifact tests
        env:
          TOKENATLAS_TEST_MANAGERS: "1"
        run: python -m unittest discover -v
      - name: Compile Python
        run: python -m compileall -q -x "[\\/]\.git[\\/]" .
      - name: Diff hygiene
        run: git diff --check

  browser:
    name: Offline report / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install build and browser tools
        run: |
          python -m pip install "setuptools>=77" wheel
          npm install --no-save @playwright/test@1.54.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build installed-package smoke report
        env:
          TOKENATLAS_SMOKE_REPORT: ${{ runner.temp }}/tokenatlas-smoke.html
        run: python test_release_artifact.py
      - name: Check report offline
        env:
          BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/@playwright/test
          SCREENSHOT_DIR: ${{ runner.temp }}
          REQUIRE_FIXTURES: "1"
        run: |
          python scripts/prompts_fixture.py "${{ runner.temp }}/tokenatlas-prompts.html" "${{ runner.temp }}/tokenatlas-shared.html"
          node test_report_browser.cjs "${{ runner.temp }}/tokenatlas-smoke.html" "${{ runner.temp }}/tokenatlas-prompts.html" "${{ runner.temp }}/tokenatlas-shared.html"
          node test_analytics_browser.cjs "${{ runner.temp }}/tokenatlas-smoke.html"
          python -m unittest test_efficiency_integration.SurfaceParity -v
          node test_efficiency_browser.cjs "${{ runner.temp }}/tokenatlas-smoke.html"
