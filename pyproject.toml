[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenatlas"
dynamic = ["version"]
description = "Local, private token and cost atlas for AI coding agents (Claude Code, Codex, OpenCode, Pi)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Magnus Gille" }]
keywords = ["claude", "codex", "opencode", "pi", "tokens", "cost", "usage", "history", "ai-coding-agents", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/Magnus-Gille/tokenatlas"
Issues = "https://github.com/Magnus-Gille/tokenatlas/issues"

[project.scripts]
tokenatlas = "tokenatlas.__main__:main"
energy-monitor = "tokenatlas.__main__:main"  # deprecated alias

[tool.setuptools]
packages = ["tokenatlas"]
include-package-data = true

[tool.setuptools.package-data]
tokenatlas = ["report_template.html", "report_i18n.json", "efficiency.js", "prices.json", "credits.json", "remote_sync.sh"]

[tool.setuptools.dynamic]
version = { attr = "tokenatlas.__version__" }
